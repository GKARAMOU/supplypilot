spring:
  application:
    name: supplypilot-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/supplypilot}
    username: ${DATABASE_USERNAME:supplypilot}
    password: ${DATABASE_PASSWORD:supplypilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:c3VwcGx5cGlsb3QtZGV2ZWxvcG1lbnQtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9u}
    expiration-seconds: 3600
  demo-user:
    username: ${DEMO_USERNAME:demo}
    password: ${DEMO_PASSWORD:supplypilot}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
